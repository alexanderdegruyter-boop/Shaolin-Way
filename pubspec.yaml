name: shaolin_way
description: "Shaolin Way — a private personal practice app for breathing, training, and reading."
# This app is for personal sideloading only. It is intentionally NOT published.
publish_to: "none"

# Bump this when you build a new APK.
version: 1.0.0+1

environment:
  # Use a recent Flutter stable (3.27+). The theme uses the current
  # *ThemeData classes (e.g. CardThemeData) introduced in Flutter 3.27.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State & storage ---
  provider: ^6.1.2          # lightweight state management
  hive: ^2.2.3              # offline key/value storage for progress + settings
  hive_flutter: ^1.1.0

  # --- Content rendering ---
  flutter_markdown: ^0.7.4+1 # renders the book chapters (.md) with nice formatting

  # --- Video playback (both backends are wired up) ---
  youtube_player_flutter: ^9.1.1 # inline YouTube playback
  video_player: ^2.9.2           # local bundled .mp4 playback (offline)

  # --- Notifications (daily reminder) ---
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  # getLocalTimezone() returns a String in 3.x–4.x (it became a TimezoneInfo
  # object in 5.0.0). Pinned below 5.0.0 to match the String usage in
  # notification_service.dart.
  flutter_timezone: ">=4.0.0 <5.0.0"

  # --- Misc ---
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Exercise / breathing data (edit these JSON files to change content)
    - assets/data/breathing.json
    - assets/data/workouts.json

    # Book reader content
    - assets/books/manifest.json
    - assets/books/shaolin_philosophy/
    - assets/books/breathing_and_training/
    - assets/books/shaolin_history/
    - assets/books/qi_gong_animals/

    # Local demo videos (drop your own .mp4 files here — see README)
    - assets/videos/
