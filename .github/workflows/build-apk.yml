name: Build APK

# Builds the sideloadable Shaolin Way APK on GitHub's runners (which have the
# Android SDK + full network access) and publishes it as a downloadable Release
# asset, so you can install it straight from your phone.

on:
  workflow_dispatch: {}          # lets you run it manually from the Actions tab
  push:
    branches:
      - claude/shaolin-way-android-app-385a0d
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write                # needed to publish the Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ShaolinWay.apk
          ls -la dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShaolinWay-APK
          path: dist/ShaolinWay.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Shaolin Way APK (build ${{ github.run_number }})
          body: |
            ## Shaolin Way — installable APK

            1. On your Android phone, tap **ShaolinWay.apk** below to download it.
            2. Open it (via your Files app). If prompted, allow **install unknown apps**
               for the app you used to open it.
            3. Tap **Install**, then launch **Shaolin Way**.

            Built from commit ${{ github.sha }}.
          files: dist/ShaolinWay.apk
